name: Update flake.lock

on:
  schedule:
    # Saturdays at 07:00 UTC (00:00 AZ), ahead of the weekend upgrade window
    - cron: "0 7 * * 6"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        run: nix flake update

      - name: Check that all configurations still evaluate
        run: nix flake check

      - name: Commit and push updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "flake.lock unchanged; nothing to commit."
          else
            git commit -m "chore(flake): update flake.lock"
            git push
          fi
